<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RD SK Shared Sheet</title>
<meta name="description" content="Choose the RD SK sheet a co-author shared with you.">
<style>
:root{--bg:#f7f6f2;--ink:#1d1c1a;--muted:#6b6862;--accent:#2f5d8a}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px}
h1{font-size:22px;margin:0 0 8px}
p{color:var(--muted)}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px}
</style>
</head>
<body>
<main>
<h1>Open a shared RD SK sheet</h1>
<p id="msg">Loading Google's file picker…</p>
<p><button id="again" hidden>Choose again</button></p>
</main>
<script src="picker-config.js"></script>
<script>
// Runs inside RD SK only: the app hands over the Google access token through window.RDSKPick (never in the URL).
function done(q) { location.href = "rdsk://picked?" + q; }
function say(t) { document.getElementById("msg").textContent = t; }
function start() {
  var cfg = window.RDSK_PICKER || {}, token = window.RDSKPick && window.RDSKPick.token();
  if (!token) return say("Open this page from the RD SK app: More → Google account → Open a sheet shared with me.");
  if (!cfg.apiKey || !cfg.appId) return done("error=" + encodeURIComponent("The file picker isn't set up yet (API key and project number in docs/picker-config.js)."));
  gapi.load("picker", function () {
    var view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setOwnedByMe(false).setMode(google.picker.DocsViewMode.LIST);
    var picker = new google.picker.PickerBuilder().addView(view).setOAuthToken(token).setDeveloperKey(cfg.apiKey).setAppId(cfg.appId)
      .setTitle("Choose the RD SK sheet shared with you").setSize(window.innerWidth, window.innerHeight)
      .setCallback(function (d) {
        if (d.action === google.picker.Action.PICKED) done("id=" + encodeURIComponent(d.docs[0].id) + "&name=" + encodeURIComponent(d.docs[0].name));
        else if (d.action === google.picker.Action.CANCEL) done("cancel=1");
      }).build();
    picker.setVisible(true);
    say("Choose the RD SK sheet your co-author shared with you.");
  });
}
document.getElementById("again").onclick = start;
window.onerror = function (m) { say("The file picker couldn't load: " + m); document.getElementById("again").hidden = false; };
</script>
<script src="https://apis.google.com/js/api.js" onload="start()" onerror="done('error=' + encodeURIComponent('No connection to Google'))"></script>
</body>
</html>
