<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RD SK</title>
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--ink:#1c1b19;--muted:#6b6862;--line:#e4e1da;
  --accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;
  --ur:#2f5d8a;--ur-soft:#e3ecf5;--rev:#b4541a;--rev-soft:#fbe9dc;--need:#a8322f;--need-soft:#f8e2e0;
  --not:#6b6862;--not-soft:#ecebe7;--acc:#2e7d4f;--acc-soft:#dff1e6;--closed:#8a8780;--closed-soft:#efeeea;
  --warn:#b07a12;--warn-soft:#fbf1d9;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151513;--card:#201f1d;--ink:#ecebe7;--muted:#a19e97;--line:#34322e;
    --accent:#7fb0e0;--accent-ink:#0f1a26;--accent-soft:#1f2c3a;
    --ur:#7fb0e0;--ur-soft:#1f2c3a;--rev:#f0a06a;--rev-soft:#3a2617;--need:#f08a85;--need-soft:#3a1d1c;
    --not:#b3b0a9;--not-soft:#2b2a27;--acc:#78cf9b;--acc-soft:#173325;--closed:#8f8c85;--closed-soft:#262522;
    --warn:#e8bd5c;--warn-soft:#3a2f14;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:76px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
main{padding:12px 16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
h2 small{text-transform:none;letter-spacing:0;font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;text-align:left;color:inherit;font:inherit}
.tile b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.tile i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.card.tap{cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.m{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:600}
.s-ur{background:var(--ur-soft);color:var(--ur)}.s-rev{background:var(--rev-soft);color:var(--rev)}
.s-need{background:var(--need-soft);color:var(--need)}.s-not{background:var(--not-soft);color:var(--not)}
.s-acc{background:var(--acc-soft);color:var(--acc)}.s-closed{background:var(--closed-soft);color:var(--closed)}
.s-warn{background:var(--warn-soft);color:var(--warn)}
.days{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;text-align:right;line-height:1}
.days small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--need)}
button.link{border:0;background:none;color:var(--accent);padding:4px 0;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;white-space:nowrap;border:0;border-radius:0;background:none;padding:10px 0 9px;font-size:11.5px;color:var(--muted)}
nav button .ic{display:block;font-size:19px;line-height:1.1}
nav button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:16px;bottom:84px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.filters button{white-space:nowrap;font-size:12.5px;padding:6px 10px;border-radius:999px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));z-index:11;transform:translateY(105%);transition:transform .2s ease}
.sheet.open{transform:none}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.statusgrid button{text-align:left}
.statusgrid button.on{outline:2px solid var(--accent);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13.5px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.stattiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{cursor:pointer}
.chart .bar.dim{opacity:.35}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.readout{font-size:13px;min-height:19px;color:var(--ink);margin-top:6px}
:root{--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme: dark){:root{--s1:#3987e5;--s2:#d95926}}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar{height:8px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.aians{font-size:14.5px;line-height:1.5;margin-top:6px;overflow-wrap:anywhere}
.aians p{margin:6px 0}.aians ul,.aians ol{margin:4px 0 8px;padding-left:20px}.aians li{margin:3px 0}
.aians .aih{font-weight:700;margin:12px 0 4px;color:var(--accent)}
.aians a{color:var(--accent)}
textarea.big{min-height:120px}
.sugwrap{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.35);max-height:280px;overflow-y:auto}
.sug button{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;
  background:var(--card);color:var(--ink);text-align:left;padding:11px 12px;font-size:14.5px}
.sug button:last-child{border-bottom:0}
.sug button:active{background:var(--accent-soft)}
.sug .mine{font-size:11px;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<header><h1 id="hTitle">RD SK</h1><div class="sub" id="hSub"></div></header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Add submission">+</button>
<nav id="nav">
  <button data-tab="home" class="on"><span class="ic">◧</span>Home</button>
  <button data-tab="review"><span class="ic">⏳</span>In review</button>
  <button data-tab="papers"><span class="ic">▤</span>Papers</button>
  <button data-tab="subs"><span class="ic">☰</span>Submissions</button>
  <button data-tab="ai"><span class="ic">✦</span>Ask AI</button>
  <button data-tab="more"><span class="ic">⋯</span>More</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,.xlsx,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script src="seed.js"></script>
<script src="portals.js"></script>
<script src="gscript.js"></script>
<script src="abdc.js"></script>
<script src="suggest.js"></script>
<script src="emailparse.js"></script>
<script src="watchlist.js"></script>
<script src="aiassist.js"></script>
<script src="gsheets.js"></script>
<script>
"use strict";
const STORE_KEY = "rdsk.state.v1";
const STATUSES = ["Planned","Under review","Revision requested","Revision resubmitted","Rejected","Returned by office","Accepted","Withdrawn"];
const OVERRIDES = ["","Closed – rejected","Parked","Published","Withdrawn"];
const TYPES = ["Journal article","EPW / short piece","Book chapter","Other"];
const CLOSED_STAGES = ["Parked","Closed – rejected","Withdrawn","Published"];

/* ---------- storage ---------- */
let S;
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ S = JSON.parse(raw); } }catch(e){}
  if(!S || !S.papers){ S = JSON.parse(JSON.stringify(window.RD_SEED)); S.settings.fresh=true; persist(false); }
  S.portals = S.portals || {}; S.settings = S.settings || {chaseDays:90};
}
function persist(touch=true){
  if(touch) S.settings.lastUpdated = today();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){ toast("Could not save: "+e.message); }
  if(touch) scheduleAutoSync();
  pushReminders();
  if(trackChanges()) gsSchedule();
}
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ---------- dates ---------- */
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dnum(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return Date.UTC(y,m-1,d)/864e5; }
function daysBetween(a,b){ return dnum(b)-dnum(a); }
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(s){ if(!s) return "—"; const [y,m,d]=s.split("-"); return (+d)+" "+MON[+m-1]+" "+y; }

/* ---------- calculations (mirror the workbook formulas) ---------- */
const isSent = s => s.status && s.status!=="Planned";
const isOpen = s => s.status==="Under review" || s.status==="Revision requested";
function subsOf(pid){ return S.subs.filter(s=>s.paper===pid); }
function paperById(id){ return S.papers.find(p=>p.id===id); }
function paperStage(p){
  if(p.override) return p.override;
  const ss = subsOf(p.id);
  if(ss.some(s=>s.status==="Accepted")) return "Accepted";
  if(ss.some(s=>s.status==="Revision requested")) return "Revision due";
  if(ss.some(s=>s.status==="Under review")) return "Under review";
  if(ss.some(isSent)) return "Needs resubmission";
  return "Not yet submitted";
}
function paperInfo(p){
  const ss = subsOf(p.id), stage = paperStage(p);
  let last=null; ss.forEach((s,i)=>{ if(isSent(s)&&s.submitted){ if(!last||s.submitted>=last.submitted) last=s; } });
  let lastDec=""; ss.forEach(s=>{ if(s.decided && s.decided>lastDec) lastDec=s.decided; });
  const next = ss.find(s=>s.status==="Planned");
  const idle = stage==="Needs resubmission" && lastDec ? daysBetween(lastDec,today()) : null;
  return {stage,last,lastDec,next,idle,sent:ss.filter(isSent).length,rejections:ss.filter(s=>s.status==="Rejected").length,subs:ss};
}
function subDays(s){
  if(!s.submitted || !isSent(s)) return null;
  return Math.max(0, s.decided ? daysBetween(s.submitted,s.decided) : daysBetween(s.submitted,today()));
}
function stageClass(st){
  return {"Under review":"s-ur","Revision due":"s-rev","Revision requested":"s-rev","Revision resubmitted":"s-closed","Needs resubmission":"s-need","Rejected":"s-need","Returned by office":"s-warn","Not yet submitted":"s-not","Planned":"s-not","Accepted":"s-acc","Published":"s-acc"}[st] || "s-closed";
}
function chaseFlag(days){
  const c = +S.settings.chaseDays || 90;
  if(days==null) return "";
  if(days>=2*c) return '<span class="chip s-need">Overdue: chase editor</span>';
  if(days>=c) return '<span class="chip s-warn">Check status</span>';
  return "";
}

/* ---------- journal portal links ---------- */
function normJ(n){ return (n||"").toLowerCase().replace(/&/g,"and").replace(/\(.*?\)/g,"").replace(/-a$/,"").replace(/[^a-z0-9]+/g," ").trim(); }
function portalFor(journal){
  if(S.portals[journal]) return {url:S.portals[journal], src:"yours"};
  const n = normJ(journal), map = window.RD_PORTALS||{};
  if(map[n]) return {url:map[n], src:"built-in"};
  if(/^[a-z0-9.-]+\.[a-z]{2,}\//i.test(journal)) return {url:"https://"+journal, src:"built-in"};
  return {url:"https://www.google.com/search?q="+encodeURIComponent(journal.replace(/-A$/,"")+" journal submit manuscript login"), src:"search"};
}
function openBrowser(u){ if(window.Android && Android.openInBrowser) Android.openInBrowser(u); else window.open(u,"_blank"); }
function openUrl(u){
  if(window.Android && Android.openUrl) Android.openUrl(u); else window.open(u,"_blank");
}

/* ---------- ui helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }
let tab="home", subFilter="Under review", paperFilter="Active", query="";
function setTab(t){ tab=t; document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); render(); window.scrollTo(0,0); }
function openSheet(html){ $("#sheet").innerHTML=html; $("#sheet").classList.add("open"); $("#scrim").classList.add("open"); $("#sheet").scrollTop=0; }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#scrim").onclick=closeSheet;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("#fab").onclick=()=>editSub(null);
window.addEventListener("popstate",()=>{ if($("#sheet").classList.contains("open")) closeSheet(); });
// Android back button → close sheet first, else go to dashboard, else exit.
window.rdOpen = t => { closeSheet(); setTab(t==="review"?"review":"home"); };
window.rdBack = function(){
  if($("#sheet").classList.contains("open")){ closeSheet(); return true; }
  if(tab!=="home"){ setTab("home"); return true; }
  return false;
};

function subCard(s, opts={}){
  const p = paperById(s.paper), d = subDays(s), open = s.status==="Under review"||s.status==="Revision requested";
  const portal = portalFor(s.journal);
  let acts = "";
  if(open){
    acts = `<div class="actions">
      <button class="primary" data-act="portal" data-id="${s.id}">Open journal login ↗</button>
      <button data-act="decide" data-id="${s.id}">Record decision</button>
      ${s.status==="Under review"&&d!=null&&d>=(+S.settings.chaseDays||90)?`<button data-act="chase" data-id="${s.id}">✉ Email editor</button>`:""}</div>`;
  }else if(s.status==="Planned" && opts.planActions!==false){
    acts = `<div class="actions"><button data-act="submitnow" data-id="${s.id}">Mark submitted today</button>
      <button class="ghost" data-act="portal" data-id="${s.id}">Journal site ↗</button></div>`;
  }
  return `<div class="card tap" data-act="editsub" data-id="${s.id}">
    <div class="row"><div class="grow">
      <div class="t">${esc(s.journal)}${abdcChip(abdcOf(s.journal))}${s.rating?` <span class="m">· ${esc(s.rating)}</span>`:""}</div>
      ${opts.hidePaper?"":`<div class="m">${esc(p?p.key:"?")}${p&&p.authors?" · "+esc(p.authors):""}</div>`}
      <div class="m">${s.submitted?"Submitted "+fmt(s.submitted):""}${s.decided?" · decided "+fmt(s.decided):""}</div>
      <div style="margin-top:5px"><span class="chip ${stageClass(s.status)}">${esc(s.status)}</span>${s.dtype&&!open?` <span class="m">${esc(s.dtype)}</span>`:""} ${open?chaseFlag(d):""}
      ${(open||s.status==="Planned")&&portal.src==="search"?`<button class="link" data-act="setlink" data-id="${s.id}" style="font-size:12.5px">🔗 Set login link</button>`:""}</div>
    </div>${d!=null?`<div class="days">${d}<small>days</small></div>`:""}</div>
    ${s.live&&open?`<div class="m" style="margin-top:6px;color:var(--ink)">🌐 <b>${esc(s.live.text)}</b> <span class="m">· checked ${fmt(s.live.at)}</span>${s.live.changedAt&&daysBetween(s.live.changedAt,today())<=14?` <span class="chip s-warn">🔔 changed${s.live.prev?" from "+esc(s.live.prev):""}</span>`:""}</div>`:""}
    ${s.notes?`<div class="m" style="margin-top:6px">${esc(s.notes)}</div>`:""}
    ${acts}</div>`;
}
function paperCard(p){
  const i = paperInfo(p);
  return `<div class="card tap" data-act="paper" data-id="${p.id}">
    <div class="row"><div class="grow"><div class="t">${esc(p.key)}</div>
      <div class="m">${p.authors?"👤 "+esc(p.authors):'<span style="color:var(--warn)">👤 Authors not added</span>'}</div>
      <div class="m">${i.last?"Last: "+esc(i.last.journal):"Never sent out"}${i.next?" · Next: "+esc(i.next.journal):""}</div>
      <div style="margin-top:5px"><span class="chip ${stageClass(i.stage)}">${esc(i.stage)}</span>
      <span class="m">${i.sent} sent · ${i.rejections} rejected</span></div></div>
      ${i.idle!=null?`<div class="days" style="color:${i.idle>=180?"var(--need)":i.idle>=60?"var(--warn)":"inherit"}">${i.idle}<small>idle days</small></div>`:""}
    </div></div>`;
}

/* ---------- views ---------- */
function render(){
  $("#hSub").textContent = "As of "+fmt(today())+" · last updated "+fmt(S.settings.lastUpdated);
  $("#fab").style.display = (tab==="more"||tab==="stats"||tab==="insights"||tab==="ai")?"none":"block";
  const v=$("#view");
  if(tab==="home") v.innerHTML=viewHome();
  else if(tab==="review") v.innerHTML=viewReview();
  else if(tab==="papers") v.innerHTML=viewPapers();
  else if(tab==="subs") v.innerHTML=viewSubs();
  else if(tab==="stats") v.innerHTML=viewStats();
  else if(tab==="insights") v.innerHTML=viewInsights();
  else if(tab==="ai") v.innerHTML=viewAI();
  else v.innerHTML=viewMore();
  bindSearch(); bindMore(); bindWelcome(); if(tab==="stats") bindStats(); if(tab==="ai") bindAI();
}
function stats(){
  const infos = S.papers.map(p=>({p,...paperInfo(p)}));
  const accepted = S.subs.filter(s=>s.status==="Accepted");
  const accDays = accepted.map(subDays).filter(d=>d!=null);
  return {
    infos,
    tracked: infos.filter(i=>!CLOSED_STAGES.includes(i.stage)).length,
    waiting: infos.filter(i=>["Revision due","Needs resubmission","Not yet submitted"].includes(i.stage)).length,
    under: infos.filter(i=>i.stage==="Under review").length,
    revdue: infos.filter(i=>i.stage==="Revision due").length,
    sent: S.subs.filter(isSent).length,
    rejected: S.subs.filter(s=>s.status==="Rejected").length,
    accepted: accepted.length,
    accAvg: accDays.length?Math.round(accDays.reduce((a,b)=>a+b,0)/accDays.length):null,
    openSubs: S.subs.filter(isOpen),
  };
}
function viewHome(){
  const st=stats();
  const waitList = st.infos.filter(i=>["Revision due","Needs resubmission","Not yet submitted"].includes(i.stage))
    .sort((a,b)=>score(b)-score(a));

function decide(s){
  const p=paperById(s.paper);
  const opts=["Rejected","Revision requested","Accepted","Returned by office","Withdrawn","Under review"];
  let pick=s.status;
  openSheet(`<h3>Record decision <button class="ghost" onclick="closeSheet()">✕</button></h3>
    <div class="t">${esc(s.journal)}</div><div class="m">${esc(p.key)} · submitted ${fmt(s.submitted)}</div>
    <label>Decision</label><div class="statusgrid" id="dg">${opts.map(o=>`<button data-o="${o}" class="${o===pick?"on":""}">${o}</button>`).join("")}</div>
    <label for="dd">Date of decision</label><input type="date" id="dd" value="${s.decided||today()}">
    <label for="dn">Notes</label><textarea id="dn">${esc(s.notes)}</textarea>
    <div id="revhint" class="hint"></div>
    <div class="actions"><button class="primary" id="dsave">Save</button></div>`);
  const hint=()=>{ $("#revhint").textContent = pick==="Rejected" ? "The paper will move to “Needs resubmission”." + (paperInfo(p).next? " Next in queue: "+paperInfo(p).next.journal : "") : pick==="Revision requested" ? "The paper will show as “Revision due”. When you resubmit, use “Resubmit revision” on the paper." : ""; };
  hint();
  $("#dg").onclick=e=>{ const b=e.target.closest("[data-o]"); if(!b) return; pick=b.dataset.o; document.querySelectorAll("#dg button").forEach(x=>x.classList.toggle("on",x===b)); hint(); };
  $("#dsave").onclick=()=>{
    s.status=pick; s.decided = pick==="Under review" ? "" : ($("#dd").value||today()); s.notes=$("#dn").value.trim();

    if(pick==="Rejected"||pick==="Returned by office") setTimeout(()=>whatNext(paperById(s.paper),s),350);
  };
}

/** Journal suggestions under a text box (the app's own list: the WebView's datalist popup is see-through in dark mode).
 *  Your own journals come first, then ABDC titles; names starting with what you typed rank above other matches. */
function journalPicker(input){
  if(!input||input.dataset.picker) return; input.dataset.picker="1";
  const wrap=document.createElement("div"); wrap.className="sugwrap"; input.parentNode.insertBefore(wrap,input); wrap.appendChild(input);
  const box=document.createElement("div"); box.className="sug"; box.hidden=true; wrap.appendChild(box);
  const mine=new Set(S.subs.map(s=>s.journal).filter(Boolean));
  const show=()=>{
    const q=normJ(input.value); if(q.length<2){ box.hidden=true; return; }
    const rank=j=>{ const n=normJ(j); if(n===q) return 0; if(n.startsWith(q)) return 1; if((" "+n).includes(" "+q)) return 2; return n.includes(q)?3:9; };
    const hits=journalOptions().map(j=>[j,rank(j)+(mine.has(j)?0:0.5)]).filter(x=>x[1]<9).sort((a,b)=>a[1]-b[1]||a[0].localeCompare(b[0])).slice(0,8).map(x=>x[0]);
    if(!hits.length||(hits.length===1&&hits[0]===input.value)){ box.hidden=true; return; }
    box.innerHTML=hits.map(j=>{ const g=abdcOf(j); return `<button type="button" data-j="${esc(j)}"><span>${esc(j)}</span><span class="mine">${g?"ABDC "+esc(g):""}${mine.has(j)?(g?" · ":"")+"yours":""}</span></button>`; }).join("");
    box.hidden=false;
  };
  input.addEventListener("input",show); input.addEventListener("focus",show);
  input.addEventListener("blur",()=>setTimeout(()=>{ box.hidden=true; },150));
  box.addEventListener("pointerdown",e=>e.preventDefault()); // keep the keyboard open while choosing
  box.addEventListener("click",e=>{ const b=e.target.closest("[data-j]"); if(!b) return; e.stopPropagation();
    input.value=b.dataset.j; box.hidden=true; input.dispatchEvent(new Event("input",{bubbles:true})); box.hidden=true; });
}

    subs.push({id:uid("s"),paper:add(k),journal:j,rating:str(at(r,SC,"rating")),status:str(at(r,SC,"status"))||"Planned",submitted:d(at(r,SC,"submitted")),decided:d(at(r,SC,"decided")),notes:str(at(r,SC,"notes")),titleUsed:str(at(r,SC,"titleUsed")),msid:str(at(r,SC,"msid")),live:lv?{text:lv,at:d(at(r,SC,"liveAt"))||today()}:undefined}); });

}

/* ---------- chase-editor email ---------- */
function chaseEmail(s){
  const p=paperById(s.paper)||{}, d=subDays(s), title=s.titleUsed||p.title||p.key||"";
  const to=(S.contacts||{})[s.journal]||"", name=S.settings.myName||"";
  const many=(p.authors||"").split(/,|;| and /).filter(x=>x.trim()).length>2;
  const subject=`Status enquiry${s.msid?" – Manuscript "+s.msid:""}: “${title}”`;
  const body=`Dear Editor,

I hope you are well. I am writing to enquire about the status of our manuscript “${title}”${s.msid?" (Manuscript ID: "+s.msid+")":""}, submitted to ${s.journal.replace(/-A$/,"")} on ${fmt(s.submitted)}.

It has now been under consideration for ${d} days, and we would be grateful for any update on its progress or an expected timeline for a decision.

Thank you for your time and for handling our submission.

Kind regards,
${name||"[Your name]"}${many?"\n(on behalf of all authors)":""}`;
  const url="mailto:"+encodeURIComponent(to).replace(/%40/g,"@")+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  if(!to) toast("Tip: add the editorial office email on the submission to fill in the To: field");
  openUrl(url);
}

/* ---------- stats ---------- */
const DECIDED=["Rejected","Accepted","Revision requested","Revision resubmitted","Returned by office","Withdrawn"];
const median=a=>{ if(!a.length) return null; const b=a.slice().sort((x,y)=>x-y), m=b.length>>1; return b.length%2?b[m]:Math.round((b[m-1]+b[m])/2); };
const qOf=iso=>{ const [y,m]=iso.split("-").map(Number); return y*4+Math.floor((m-1)/3); };
const qName=q=>Math.floor(q/4)+" Q"+(q%4+1);
let statsShowAll=false;
function statData(){
  const sent=S.subs.filter(s=>isSent(s)&&s.submitted);
  const dec=sent.filter(s=>DECIDED.includes(s.status)&&s.decided);
  const rej=dec.filter(s=>s.status==="Rejected"), acc=dec.filter(s=>s.status==="Accepted");
  const rejDays=rej.map(subDays).filter(x=>x!=null);
  const quick=rejDays.filter(x=>x<=14).length;
  const reviewed=rejDays.filter(x=>x>14);
  const nowQ=qOf(today()), qs=[]; for(let q=nowQ-7;q<=nowQ;q++) qs.push({q,label:qName(q),sub:0,dec:0});
  sent.forEach(s=>{ const r=qs.find(x=>x.q===qOf(s.submitted)); if(r) r.sub++; });
  dec.forEach(s=>{ const r=qs.find(x=>x.q===qOf(s.decided)); if(r) r.dec++; });
  const out={}; sent.forEach(s=>{ const k=s.status==="Revision resubmitted"?"Revision requested":s.status; out[k]=(out[k]||0)+1; });
  const J={}; sent.forEach(s=>{ const k=s.journal.replace(/-A$/,"").replace(/\s*\((Sage|Wiley|SAGE)\)$/,""); const j=J[k]=J[k]||{name:k,n:0,days:[],rej:0,acc:0,open:0}; j.n++;
    if(DECIDED.includes(s.status)&&s.decided){ j.days.push(subDays(s)); } if(s.status==="Rejected") j.rej++; if(s.status==="Accepted") j.acc++; if(isOpen(s)) j.open++; });
  const journals=Object.values(J).map(j=>({...j,med:median(j.days)})).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
  const papers=S.papers.map(p=>{ const i=paperInfo(p), ss=i.subs.filter(s=>isSent(s)&&s.submitted).map(s=>s.submitted).sort(); return {p,i,first:ss[0]||"",age:ss[0]?daysBetween(ss[0],today()):null}; })
    .filter(x=>x.i.sent>0).sort((a,b)=>b.i.sent-a.i.sent||(b.age||0)-(a.age||0));
  return {sent,dec,rej,acc,rejDays,quick,reviewed,qs,out,journals,papers,
    accRate:acc.length+rej.length?Math.round(100*acc.length/(acc.length+rej.length)):null};
}
function viewStats(){
  const D=statData();
  const tile=(v,l,sub)=>`<div class="tile"><b>${v}</b><span>${l}</span>${sub?`<i>${sub}</i>`:""}</div>`;
  const maxQ=Math.max(1,...D.qs.map(q=>Math.max(q.sub,q.dec)));
  // grouped bar chart, one y-axis (counts)
  const W=340,H=170,L=22,B=22,T=8,gw=(W-L)/D.qs.length,bw=Math.min(14,(gw-10)/2), y=v=>T+(H-T-B)*(1-v/maxQ);
  const step=maxQ<=5?1:maxQ<=10?2:maxQ<=25?5:10, ticks=[]; for(let v=0;v<=maxQ;v+=step) ticks.push(v);
  const bar=(x,v,cls,fill,qi)=>{ if(!v) return ""; const top=y(v),h=H-B-top,r=Math.min(4,h); return `<path class="bar ${cls}" data-q="${qi}" fill="${fill}" d="M${x},${H-B} V${top+r} q0,-${r} ${r},-${r} h${bw-2*r} q${r},0 ${r},${r} V${H-B} Z"/>`; };
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Submissions and decisions per quarter">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("")}
    ${D.qs.map((q,i)=>{ const x0=L+i*gw+(gw-2*bw-2)/2; return `<rect class="bar" data-q="${i}" x="${L+i*gw}" y="${T}" width="${gw}" height="${H-B-T}" fill="transparent"/>`+bar(x0,q.sub,"s","var(--s1)",i)+bar(x0+bw+2,q.dec,"d","var(--s2)",i)+`<text class="ax" x="${L+i*gw+gw/2}" y="${H-6}" text-anchor="middle">${i%2===1||D.qs.length<=6?q.label.replace(/^\d\d/,"’"):""}</text>`; }).join("")}
  </svg>`;
  const OUT=["Under review","Rejected","Revision requested","Returned by office","Accepted","Withdrawn"].filter(k=>D.out[k]);
  const maxO=Math.max(1,...OUT.map(k=>D.out[k]));
  const jl=statsShowAll?D.journals:D.journals.slice(0,12);
  return `
  <div class="row" style="margin-bottom:6px"><button class="ghost" data-go="home">← Dashboard</button></div>
  <div class="stattiles">
    ${tile(D.sent.length,"Submissions sent",D.dec.length+" decided")}
    ${tile(D.accRate!=null?D.accRate+"%":"—","Acceptance rate",D.acc.length+" accepted · "+D.rej.length+" rejected")}
    ${(()=>{ const known=D.rej.filter(x=>x.dtype), desk=known.filter(x=>/^desk/i.test(x.dtype)).length;
      return known.length>=3?tile(Math.round(100*desk/known.length)+"%","Desk rejections",desk+" of "+known.length+" rejections with a known type (from emails)")
        :tile(D.rejDays.length?Math.round(100*D.quick/D.rejDays.length)+"%":"—","Quick rejections",D.quick+" of "+D.rejDays.length+" within 14 days (likely desk)"); })()}
    ${tile(median(D.reviewed)!=null?median(D.reviewed)+" d":"—","Median after review",D.reviewed.length+" rejections after 14+ days")}
  </div>

  <h2>Per quarter <small>last 2 years</small></h2>
  <div class="card chart">
    <div class="legend"><span><i style="background:var(--s1)"></i>Submitted</span><span><i style="background:var(--s2)"></i>Decisions received</span></div>
    ${svg}
    <div class="readout" id="qread">Tap a quarter for its numbers.</div>
    <details style="margin-top:6px"><summary class="m">Show as table</summary>
      <table class="tbl"><tr><th>Quarter</th><th class="n">Submitted</th><th class="n">Decisions</th></tr>
      ${D.qs.slice().reverse().map(q=>`<tr><td>${q.label}</td><td class="n">${q.sub}</td><td class="n">${q.dec}</td></tr>`).join("")}</table></details>
  </div>

  <h2>Where submissions ended up</h2>
  <div class="card">
    <table class="tbl">${OUT.map(k=>`<tr><td style="width:42%"><span class="chip ${stageClass(k)}">${k}</span></td><td><div class="hbar" style="width:${Math.max(2,100*D.out[k]/maxO)}%"></div></td><td class="n" style="width:12%">${D.out[k]}</td></tr>`).join("")}</table>
  </div>

  <h2>Journals <small>by number of tries</small></h2>
  <div class="card" style="padding:6px 10px">
    <table class="tbl"><tr><th>Journal</th><th class="n">ABDC</th><th class="n">Tries</th><th class="n">Median days</th><th class="n">Result</th></tr>
    ${jl.map(j=>`<tr><td>${esc(j.name)}</td><td class="n">${esc(abdcOf(j.name)||"—")}</td><td class="n">${j.n}</td><td class="n">${j.med??"—"}</td><td class="n">${[j.acc?j.acc+" acc":"",j.rej?j.rej+" rej":"",j.open?j.open+" open":""].filter(Boolean).join(", ")||"—"}</td></tr>`).join("")}</table>
    ${D.journals.length>12?`<div class="actions" style="margin:8px 0 4px"><button class="link" id="jall">${statsShowAll?"Show fewer":"Show all "+D.journals.length+" journals"}</button></div>`:""}
    <div class="hint" style="margin:6px 0 4px">Median days = submission to decision, from your own history.</div>
  </div>

  <h2>Papers <small>most submitted first</small></h2>
  <div class="card" style="padding:6px 10px">
    <table class="tbl"><tr><th>Paper</th><th class="n">Sent</th><th class="n">Rej.</th><th class="n">Days since first</th></tr>
    ${D.papers.map(x=>`<tr data-act="paper" data-id="${x.p.id}" style="cursor:pointer"><td>${esc(x.p.key)}<br><span class="chip ${stageClass(x.i.stage)}" style="margin-top:3px">${esc(x.i.stage)}</span></td><td class="n">${x.i.sent}</td><td class="n">${x.i.rejections}</td><td class="n">${x.age??"—"}</td></tr>`).join("")}</table>
  </div>`;
}
function bindStats(){
  const D=statData(), r=$("#qread");
  document.querySelectorAll(".chart .bar").forEach(el=>el.addEventListener("click",()=>{
    const i=+el.dataset.q, q=D.qs[i];
    r.innerHTML=`<b>${q.label}</b>: ${q.sub} submitted · ${q.dec} decision${q.dec===1?"":"s"} received`;
    document.querySelectorAll(".chart path.bar").forEach(b=>b.classList.toggle("dim",+b.dataset.q!==i));
  }));
  const ja=$("#jall"); if(ja) ja.onclick=()=>{ statsShowAll=!statsShowAll; render(); };
}

/* ---------- add submissions from rdsk:// links (QR code, share, paste) ---------- */
// rdsk://add?p=<paper short name>&j=<journal>&s=<status>&d=<yyyy-mm-dd>&r=<rating>&m=<manuscript id>&n=<notes>&t=<paper title>&a=<authors>&l=<login link>&f=<decision date>
function parseAddLinks(text){
  return (String(text).match(/rdsk:\/\/add\?[^\s"'<>]+/gi)||[]).map(u=>{
    const q=new URLSearchParams(u.slice(u.indexOf("?")+1)), g=k=>(q.get(k)||"").trim();
    const st=STATUSES.find(x=>x.toLowerCase()===g("s").toLowerCase())||(g("d")?"Under review":"Planned");
    const date=v=>/^\d{4}-\d{2}-\d{2}$/.test(v)?v:"";
    return {paper:g("p"), journal:g("j"), status:st, submitted:date(g("d")), decided:date(g("f")), rating:g("r"), msid:g("m"), notes:g("n"), title:g("t"), authors:g("a"), link:g("l")};
  }).filter(e=>e.paper&&e.journal);
}
function findPaper(name){ const k=name.trim().toLowerCase(); return S.papers.find(p=>p.key.toLowerCase()===k)||S.papers.find(p=>p.title&&p.title.toLowerCase()===k); }
function existingSub(e,p){ return p&&S.subs.find(s=>s.paper===p.id&&((e.msid&&s.msid&&baseId(s.msid)===baseId(e.msid))||(normJ(s.journal)===normJ(e.journal)&&(s.status==="Planned"||s.status===e.status||(isOpen(s)&&e.status!=="Planned"&&s.submitted===e.submitted))))); }
function addLinksSheet(text){

/* ---------- QR scanner (camera, or a photo of the code) ---------- */
let scanStream=null, scanTimer=null;
function loadJsQR(){ return window.jsQR?Promise.resolve():new Promise((ok,bad)=>{ const sc=document.createElement("script"); sc.src="jsQR.min.js"; sc.onload=ok; sc.onerror=bad; document.head.appendChild(sc); }); }
function stopScan(){ clearInterval(scanTimer); scanTimer=null; if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } }
function gotCode(text){
  stopScan();
  if(/rdsk:\/\/add\?/i.test(text)) addLinksSheet(text);
  else { closeSheet(); alert("This QR code isn't an RD SK entry:\n\n"+text.slice(0,300)); }
}
function decodeCanvas(cv){ const ctx=cv.getContext("2d",{willReadFrequently:true}), im=ctx.getImageData(0,0,cv.width,cv.height); const r=window.jsQR&&jsQR(im.data,im.width,im.height,{inversionAttempts:"attemptBoth"}); return r&&r.data; }
async function scanSheet(){
  openSheet(`<h3>Scan QR code <button class="ghost" id="qclose">✕</button></h3>
    <div style="position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:1/1"><video id="qv" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
      <div style="position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px"></div></div>
    <div class="hint" id="qmsg">Starting camera…</div>
    <div class="actions"><button id="qphoto">🖼 Scan from a photo / screenshot</button></div>
    <input type="file" id="qfile" accept="image/*" hidden>
    <div class="hint">Make QR codes on your laptop with the <b>RD SK New Submissions</b> Excel file.</div>`);
  $("#qclose").onclick=()=>{ stopScan(); closeSheet(); };
  $("#scrim").addEventListener("click",stopScan,{once:true});
  $("#qphoto").onclick=()=>$("#qfile").click();
  $("#qfile").onchange=async ev=>{ const f=ev.target.files[0]; if(!f) return; await loadJsQR();
    const img=new Image(); img.onload=()=>{ const cv=document.createElement("canvas"), k=Math.min(1,1600/Math.max(img.width,img.height)); cv.width=img.width*k; cv.height=img.height*k; cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const t=decodeCanvas(cv); if(t) gotCode(t); else toast("No QR code found in that picture"); }; img.src=URL.createObjectURL(f); };
  try{
    await loadJsQR();
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    const v=$("#qv"); v.srcObject=scanStream; await v.play();
    $("#qmsg").textContent="Point the camera at the QR code.";
    const det=("BarcodeDetector" in window)?new BarcodeDetector({formats:["qr_code"]}):null, cv=document.createElement("canvas");
    scanTimer=setInterval(async()=>{
      if(!v.videoWidth) return;
      try{ if(det){ const r=await det.detect(v); if(r.length) return gotCode(r[0].rawValue); } }catch(e){}
      const k=Math.min(1,720/v.videoWidth); cv.width=v.videoWidth*k; cv.height=v.videoHeight*k; cv.getContext("2d",{willReadFrequently:true}).drawImage(v,0,0,cv.width,cv.height);
      const t=decodeCanvas(cv); if(t) gotCode(t);
    },300);
  }catch(err){ $("#qmsg").innerHTML="Camera not available ("+esc(err.message||err.name)+"). Allow camera access for RD SK, or scan from a photo."; }
}

/* ---------- live status from journal sites ---------- */
const DECISION_WORDS=/\b(reject|declin|accept|revis|decision (letter|made|sent)|unsubmitted|withdrawn)/i;
const KNOWN_STATUS=["Awaiting Reviewer Selection","Awaiting Reviewer Invitation","Awaiting Reviewer Assignment","Awaiting Reviewer Scores","Awaiting Reviewer Score","Awaiting AE Recommendation","Awaiting EIC Decision","Awaiting Editor Decision","Awaiting Admin Processing","Awaiting Admin Checklist","Awaiting Decision","Decision in Process","Decision Letter Being Prepared","Required Reviews Completed","Reviews Completed","Under Review","Reviewers Assigned","Reviewer(s) Invited","Reviewers Invited","With Editor","Editor Assigned","Editor Invited","Submitted to Journal","With Journal Administrator","Revise","Major Revision","Minor Revision","Reject","Accept","Unsubmitted","Withdrawn"];
function cleanStatus(row){
  const raw=row.status.toLowerCase();
  for(const k of KNOWN_STATUS) if(raw.includes(k.toLowerCase())) return k;
  const t=row.status.replace(/\b(ADM|EIC|AE|SE|ME|EO|CE|DE):\s*[^•]*?(?=•|$)/g," ").replace(/[•·]/g," ").replace(/\s+/g," ").trim();
  for(const k of KNOWN_STATUS) if(t.toLowerCase().includes(k.toLowerCase())) return k;
  return (t||row.status).replace(/\b(view|contact journal|view submission|send e-?mail|action links?)\b.*$/i,"").trim().slice(0,90);
}
const words=t=>(t||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(" ").filter(w=>w.length>3);
function overlap(a,b){ const B=new Set(words(b)); const A=words(a); return A.length?A.filter(w=>B.has(w)).length/A.length:0; }
const baseId=id=>(id||"").toUpperCase().replace(/\.R\d+$/,"");
function checkAllStatuses(){
  const groups={};
  S.subs.filter(isOpen).forEach(s=>{ const po=portalFor(s.journal); if(po.src==="search") return; const g=groups[po.url]=groups[po.url]||{key:po.url,url:po.url,journal:s.journal.replace(/-A$/,""),papers:[]}; g.papers.push((paperById(s.paper)||{}).key||""); });
  const targets=Object.values(groups).map(g=>({...g,count:g.papers.length,papers:g.papers.join("; ")}));
  if(!targets.length) return toast("No under-review journals with a known login link");
  if(window.Android && Android.checkStatuses) Android.checkStatuses(JSON.stringify(targets));
  else toast("This works in the phone app");
}
window.rdStatusResults=json=>{
  let res={}; try{ res=JSON.parse(json); }catch(e){}
  const report=[], byUrl={};
  S.subs.filter(isOpen).forEach(s=>{ const po=portalFor(s.journal); if(po.src!=="search") (byUrl[po.url]=byUrl[po.url]||[]).push(s); else report.push({s,found:false,nolink:true}); });
  Object.entries(byUrl).forEach(([url,subs])=>{
    const r=res[url];
    if(!r||!r.rows||!r.rows.length){ subs.forEach(s=>report.push({s,found:false,visited:!!r})); return; }
    // score every submission/row pair, then assign best pairs first so two papers at one journal each get their own row
    const pairs=[];
    subs.forEach(s=>{ const p=paperById(s.paper)||{};
      r.rows.forEach((row,ri)=>{ const hay=row.title||row.row; let sc=0;
        if(s.msid&&row.msid&&baseId(s.msid)===baseId(row.msid)) sc+=100;
        sc+=40*Math.max(overlap(p.title,hay),overlap(s.titleUsed,hay),overlap(p.key,hay));
        pairs.push({s,ri,sc}); }); });
    pairs.sort((a,b)=>b.sc-a.sc);
    const usedS=new Set(), usedR=new Set(), match=new Map();
    pairs.forEach(x=>{ if(x.sc>=15&&!usedS.has(x.s)&&!usedR.has(x.ri)){ usedS.add(x.s); usedR.add(x.ri); match.set(x.s,r.rows[x.ri]); } });
    const leftS=subs.filter(s=>!usedS.has(s)), leftR=r.rows.filter((_,i)=>!usedR.has(i));
    if(leftS.length===1&&leftR.length===1) match.set(leftS[0],leftR[0]); // only one possibility left
    subs.forEach(s=>{
      const best=match.get(s);
      if(!best){ report.push({s,found:false,visited:true}); return; }
      const text=cleanStatus(best), prev=s.live&&s.live.text, changed=!!prev&&prev!==text;
      s.live={text, at:today(), prev:changed?prev:(s.live&&s.live.prev)||"", changedAt:changed?today():(s.live&&s.live.changedAt)||""};
      s.liveLog=s.liveLog||[];
      if(!s.liveLog.length||s.liveLog[s.liveLog.length-1].text!==text) s.liveLog.push({at:today(),text});
      if(!s.msid&&best.msid) s.msid=best.msid;
      report.push({s,found:true,text,changed,prev,decision:DECISION_WORDS.test(text)});
    });
  });
  persist(false); render();
  report.sort((a,b)=>(b.found-a.found)||((b.changed||0)-(a.changed||0))||(b.visited-a.visited));
  const ok=report.filter(x=>x.found);
  openSheet(`<h3>Status check <button class="ghost" onclick="closeSheet()">✕</button></h3>
    <div class="m">${ok.length} of ${report.length} submissions updated · ${ok.filter(x=>x.changed).length} changed</div>
    ${report.map(x=>{ const p=paperById(x.s.paper)||{}; return `<div class="card"><div class="t">${esc(x.s.journal)}</div><div class="m">${esc(p.key||"")}</div>
      ${x.found?`<div style="margin-top:6px">🌐 <b>${esc(x.text)}</b> ${x.changed?`<span class="chip s-warn">🔔 was ${esc(x.prev)}</span>`:""}</div>
        ${x.decision?`<div class="actions"><button data-act="decide" data-id="${x.s.id}">Looks like a decision: record it</button></div>`:""}`
      :x.nolink?`<div class="actions"><button data-act="setlink" data-id="${x.s.id}">🔗 No login link yet: set it</button></div>`
      :`<div class="m" style="margin-top:6px">${x.visited?"Not found on the pages you opened. Open the list of submitted manuscripts and try again.":"Skipped."}</div>`}</div>`; }).join("")}`);
};

/** What recent issues of each journal publish: Crossref titles counted by type (5 journals at a time, about 25 s at most). */
async function aiProfiles(names){
  const out={}, watch={}; (window.RD_WATCH||[]).forEach(w=>{ watch[rdNormName(w.name)]=w.issn&&w.issn[0]; });
  const one=async n=>{ const issn=watch[rdNormName(n)]||"";
    try{ const r=await Promise.race([httpCall("GET",rdJournalProfileUrl(n,issn,""),"",""),new Promise(ok=>setTimeout(()=>ok({status:0}),20000))]);
      out[n]=r.status===200?rdJournalProfile(JSON.parse(r.text),n,!!issn):null; }catch(e){ out[n]=null; } };
  for(let i=0;i<names.length;i+=5) await Promise.all(names.slice(i,i+5).map(one));
  return out;
}
async function aiRun(mode){
  const p=paperById(AIU.paper), kind=aiKind(p), journal=(AIU.journal||"").trim(), extra=(AIU.extra||"").trim();
  if((kind==="fit"||kind==="cover")&&!journal) return toast("Type the journal name first");
  if(kind==="ask"&&!extra) return toast("Type your question first");
  if(mode==="here"&&!GS.gemini&&!GS.url) return toast("Add your free Gemini key first (More → Ask AI), or use Ask in Gemini app");
  const approach=p?(p.approach||rdGuessApproach(p)):"";
  const subs=p?subsOf(p.id).slice().sort((a,b)=>(a.submitted||"~").localeCompare(b.submitted||"~")).map(s=>({journal:s.journal,abdc:abdcOf(s.journal),status:s.status,submitted:s.submitted,decided:s.decided,dtype:s.dtype||"",notes:s.notes||""})):[];
  let candidates=[];
  if(p&&kind!=="cover"){
    const tried=new Set(subs.map(x=>normJ(x.journal)));
    const own=rdShortlist(p).filter(n=>!tried.has(normJ(n))).slice(0,6).map(n=>{ const j=rdLookup(window.RD_ABDC||[],n); return {title:j?j[0]:n,grade:j?j[1]:"",publisher:j?j[3]:"",mine:true}; });
    const seen=new Set(own.map(c=>normJ(c.title)));
    candidates=own.concat(rdSuggest({key:p.key,title:p.title},subs,window.RD_ABDC||[],12).filter(j=>!seen.has(normJ(j.title))).slice(0,14-own.length).map(j=>({title:j.title,grade:j.grade,publisher:j.publisher})));
  }
  const names=(kind==="ask"?[]:candidates.map(c=>c.title)).concat(journal&&kind!=="cover"?[journal]:[]);
  let profiles={};
  if(names.length){ aiSetBusy("Checking what "+names.length+" journal"+(names.length>1?"s":"")+" published recently (Crossref)…"); profiles=await aiProfiles(names); }
  const prompt=rdAiPrompt(kind,{paper:p,approach,subs,candidates,profiles,journal,journalAbdc:journal?abdcOf(journal):"",extra});
  const meta={id:uid("ai"),paper:p?p.key:"",approach,kind,journal,question:extra};
  if(mode==="gemini"){
    aiAwait(Object.assign({prompt},meta)); AIU.paste=""; aiSetBusy("");
    toGemini(prompt);
    return;
  }
  aiSetBusy("Asking Gemini… (10–40 seconds)");
  if(GS.gemini){
    try{ const r=await geminiAsk(GS.gemini,prompt);
      aiAdd(Object.assign({},meta,{at:new Date().toISOString(),answer:r.text,by:r.by,sources:r.sources,prompt,sent:false}));
      AIU.extra=""; aiSetBusy(""); gsSchedule(); toast("Answer ready ✓");
    }catch(err){ aiSetBusy(""); alert("Couldn't get an answer: "+err.message); }
    return;
  }
  try{
    const r=await httpCall("POST",GS.url,"",JSON.stringify({ask:Object.assign({prompt},meta)}));
    let j=null; try{ j=JSON.parse(r.text); }catch(e){}
    if(!j) throw new Error(r.status===0?"No connection":"Unexpected reply ("+r.status+"). Did you deploy the new script version?");
    if(!j.ok) throw new Error(j.error||"No answer");
    aiAdd(Object.assign({},j.entry,{prompt,sent:true}));
    AIU.extra=""; aiSetBusy(""); toast("Answer ready ✓");
  }catch(err){ aiSetBusy(""); alert("Couldn't get an answer: "+err.message); }
}

let gTok={token:"",at:0}; const gWait={}; let gSeq=0;
window.rdGoogleDone=(id,ok,val,email)=>{ const w=gWait[id]; delete gWait[id]; if(w) w({ok,val,email}); };
function gCall(fn){ return new Promise(res=>{ const id="g"+(++gSeq); gWait[id]=res; fn(id); }); }
function gDirect(){ return !!(GS.drive&&GS.drive.id); }
function gsOn(){ return !!(GS.url||gDirect()); }
async function googleToken(interactive){
  if(gTok.token&&Date.now()-gTok.at<45*60e3) return gTok.token;
  if(window.RDSK_TEST_GOOGLE){ gTok={token:"test-token",at:Date.now()}; return gTok.token; }
  if(!(window.Android&&Android.googleToken)) throw new Error("Google sign-in works in the phone app");
  const r=await gCall(id=>Android.googleToken(id,!!interactive));
  if(!r.ok){ if(r.val==="consent-needed"||r.val==="not-signed-in") throw new Error("Please sign in with Google again (More → Google account)"); throw new Error(r.val==="cancelled"?"Sign-in cancelled":r.val); }
  gTok={token:r.val,at:Date.now()}; return r.val;
}
function googleErr(st,j){
  const m=(j&&j.error&&j.error.message)||("Google error "+st);
  if(/has not been used|is disabled|SERVICE_DISABLED|not been enabled/i.test(m)) return "Turn on the Google Sheets API and the Google Drive API in your Google Cloud project, then try again.";
  if(st===404) return "Your RD SK sheet wasn't found (deleted, or in another account). Sign in again to pick or create one.";
  if(st===403&&/insufficient|scope|permission/i.test(m)) return "Google didn't give RD SK access to this sheet. Sign in again and allow access.";
  return m;
}
async function gApi(method,path,body,retry){
  const token=await googleToken(false);
  const url=/^https:/.test(path)?path:"https://sheets.googleapis.com/v4/"+path;
  const r=await httpCall(method,url,token,body?JSON.stringify(body):"");
  if(r.status===401&&!retry){ gTok={token:"",at:0}; return gApi(method,path,body,true); }
  let j={}; try{ j=r.text?JSON.parse(r.text):{}; }catch(e){}
  if(r.status===0) throw new Error("No connection");
  if(r.status>=400) throw new Error(googleErr(r.status,j));
  return j;
}
/** A new Google Sheet in your Drive, made from the built-in master template (all tabs, formulas and the ABDC list). */
async function gCreateSheet(title){
  const meta=rdgCreateMeta(title), token=await googleToken(false);

/** Gemini straight from the phone: Google Search grounding first, a busy model is retried, then the other free models. */
async function geminiAsk(key,prompt){
  const base="https://generativelanguage.googleapis.com/v1beta/models", started=Date.now();
  let models=GEMINI_PHONE.slice();
  try{ const r=await httpCall("GET",base+"?pageSize=1000&key="+encodeURIComponent(key),"","");
    if(r.status===400||r.status===403) throw new Error("Gemini didn't accept the key: check it in More → Ask AI");
    const names=(JSON.parse(r.text).models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>String(m.name).replace(/^models\//,""));
    const known=GEMINI_PHONE.filter(n=>names.includes(n)), flash=names.filter(n=>/^gemini-[\d.]+-flash(-lite)?$/.test(n)&&!known.includes(n)).sort((a,b)=>parseFloat(b.split("-")[1])-parseFloat(a.split("-")[1]));
    if(known.length||flash.length) models=known.concat(flash);
  }catch(e){ if(/didn't accept/.test(e.message)) throw e; }
  let busy=0, quota=0, last="";
  for(const m of models.slice(0,4)){
    for(const k of [0,1,2]){
      if(Date.now()-started>85000) break;
      if(k===2&&!busy) break;
      const grounded=k===0, body={contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.4}};
      if(grounded) body.tools=[{google_search:{}}];
      const r=await httpCall("POST",base+"/"+m+":generateContent?key="+encodeURIComponent(key),"",JSON.stringify(body));
      if(r.status===429){ quota++; break; }
      if(r.status===500||r.status===503||r.status===504){ busy++; await new Promise(ok=>setTimeout(ok,k===1?2500:800)); continue; }
      if(r.status===404) break;
      if(r.status===0){ last="No connection"; continue; }
      if(r.status!==200){ last="Gemini error "+r.status; continue; }
      let j={}; try{ j=JSON.parse(r.text); }catch(e){}
      const c=(j.candidates||[])[0], text=c&&c.content?(c.content.parts||[]).map(p=>p.text||"").join("").trim():"";
      if(!text){ last="Gemini gave no answer"; continue; }
      const sources=((c.groundingMetadata||{}).groundingChunks||[]).map(g=>g.web?{title:g.web.title||"",url:g.web.uri}:null).filter(x=>x&&x.url).slice(0,8);
      return {text,by:"Gemini ("+m+(grounded?", with Google Search":"")+")",sources};
    }
  }
  if(busy) throw new Error("Google's free Gemini models are busy right now (error 503), even after retrying. Try again in a few minutes, or use “Ask in Gemini app”.");
  if(quota) throw new Error("Gemini's free limit is used up for now. Try again later, or use “Ask in Gemini app”.");
  throw new Error(last||"Gemini gave no answer");
}
const GEMINI_PHONE=["gemini-3.8-flash","gemini-3.6-flash","gemini-3.5-flash-lite","gemini-3.1-flash-lite","gemini-2.5-flash"];

      <div class="hint">Page looks wrong or empty? In Chrome tap ⋮ → <b>Desktop site</b>. Prefer a token limited to just this repo? <button class="link" data-act="ghnewfine">Use a fine-grained token instead</button> (on that page choose <b>Only select repositories → ${esc(GH.repo.split("/")[1]||"")}</b>).</div>
    </div>`}
    <label for="ghtoken">Access token ${on?"(saved)":""}</label>
    <div class="row"><input id="ghtoken" class="grow" type="password" placeholder="${on?"•••••••• (leave blank to keep)":"paste token here"}" autocapitalize="off" autocorrect="off"><button data-act="ghpaste">Paste</button></div>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"><input type="checkbox" id="ghauto" style="width:auto" ${GH.auto?"checked":""}> Sync automatically after each change</label>
    <div class="actions"><button class="${on?"":"primary"}" data-act="ghsave">${on?"Save settings":"Save & test"}</button>
      ${on?`<button class="primary" data-act="ghsync">Sync now ↑</button><button data-act="ghpull">Load from GitHub ↓</button><button class="danger ghost" data-act="ghforget">Remove token</button>`:""}</div>
    <div class="hint">The token stays on this phone and is never included in exports, backups or synced files.</div>`;
}
function ghSaveSettings(){
  GH.repo=$("#ghrepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,"");
  GH.branch=$("#ghbranch").value.trim()||"main"; GH.folder=$("#ghfolder").value.trim().replace(/^\/|\/$/g,"");
  const t=$("#ghtoken").value.replace(/\s+/g,"");
  if(t && !/^(ghp_|github_pat_|gho_)[A-Za-z0-9_]{20,}$/.test(t)) return toast("That doesn't look like a GitHub token (it should start with ghp_ or github_pat_)");
  const isNew=!!t; if(t) GH.token=t; GH.auto=$("#ghauto").checked; GH.lastError="";
  ghStore(); render();
  if(GH.token && isNew) ghSync(false); else toast(GH.token?"Saved":"Saved. Add a token to enable sync.");
}
function ghPath(name){ return (GH.folder?GH.folder+"/":"")+name; }
// In the app, requests go through native code (no browser CORS rules); in a desktop browser, plain fetch.
const httpWaiters={}; let httpSeq=0;
window.rdHttpDone=(id,status,text)=>{ const w=httpWaiters[id]; delete httpWaiters[id]; if(w) w({status,text}); };
function httpCall(method,url,token,body){
  if(window.Android && Android.httpAsync) return new Promise(res=>{ const id="h"+(++httpSeq); httpWaiters[id]=res; Android.httpAsync(id,method,url,token,body||""); });
  const gh=/^https:\/\/api\.github\.com\//.test(url), headers={};
  if(token){ headers.Authorization="Bearer "+token; if(gh){ headers.Accept="application/vnd.github+json"; headers["X-GitHub-Api-Version"]="2022-11-28"; } }
  if(body&&!gh) headers["Content-Type"]="application/json";
  return fetch(url,{method,headers,body:body||undefined,cache:"no-store"})
    .then(async r=>({status:r.status,text:await r.text()}),e=>({status:0,text:JSON.stringify({message:"Network error: "+e.message})}));
}
async function ghApi(method, path, body){
  const r=await httpCall(method,`https://api.github.com/repos/${GH.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`+(method==="GET"?`?ref=${encodeURIComponent(GH.branch)}`:""),GH.token,body?JSON.stringify(body):"");
  if(method==="GET"&&r.status===404) return null;
  let j={}; try{ j=JSON.parse(r.text); }catch(e){}
  if(r.status===0) throw new Error(j.message||"No connection");
  if(r.status<200||r.status>=300) throw new Error(r.status===401?"Token rejected (401): check or regenerate it":r.status===403||r.status===404?`No write access to ${GH.repo} (${r.status}): check the token's repository and Contents permission`:(j.message||"HTTP "+r.status));
  return j;
}
async function ghPut(name, b64, msg){
  const path=ghPath(name), cur=await ghApi("GET",path);
  if(cur && cur.content && cur.content.replace(/\s/g,"")===b64) return false; // unchanged
  await ghApi("PUT",path,{message:msg, content:b64, branch:GH.branch, sha:cur?cur.sha:undefined});
  return true;
}
let ghBusy=false, ghTimer=null;
function scheduleAutoSync(){ if(!GH.token||!GH.auto) return; clearTimeout(ghTimer); ghTimer=setTimeout(()=>ghSync(true),8000); }
async function ghSync(auto){
  if(!GH.token) return toast("Add a GitHub token first");
  if(ghBusy){ scheduleAutoSync(); return; }
  if(!navigator.onLine){ GH.lastError="Offline – will retry after your next change"; ghStore(); if(!auto) toast("You're offline"); return; }
  ghBusy=true; if(!auto) toast("Syncing…");
  try{
    const u8=new TextEncoder().encode(JSON.stringify(S,null,1));
    const msg="RD SK update "+new Date().toLocaleString();
    const a=await ghPut("rdsk-backup.json", bytesToB64(u8), msg);
    const b=await ghPut("Research_Dashboard.xlsx", buildXlsxB64(), msg);
    GH.lastSync=new Date().toLocaleString(); GH.lastError=""; ghStore();
    toast(a||b?"Connected ✓ Synced to GitHub":"Connected ✓ Already up to date");
  }catch(err){ GH.lastError=err.message; ghStore(); toast("Sync failed: "+err.message); }
  ghBusy=false; if(tab==="more") render();
}
async function ghPull(){
  try{
    toast("Loading…");
    const f=await ghApi("GET",ghPath("rdsk-backup.json")); if(!f) return toast("No backup in the repo yet: tap “Sync now” first");
    const bin=atob(f.content.replace(/\s/g,"")), next=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
    if(!next.papers||!next.subs) throw new Error("Not an RD SK backup");
    if(!confirm(`Replace the data on this phone with the GitHub copy (${next.papers.length} papers, ${next.subs.length} submissions, last updated ${fmt(next.settings&&next.settings.lastUpdated)})?`)) return;
    S=next; S.portals=S.portals||{}; persist(false); render(); toast("Loaded from GitHub");
  }catch(err){ alert("Load failed: "+err.message); }
}

load(); baseline(); render(); pushReminders(); setTimeout(()=>askNotifications(false),1500);
if(gsOn()&&GS.auto) setTimeout(()=>gsSync("normal",false),1200);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&gsOn()&&GS.auto&&Date.now()-GS.lastSync>60000) gsSync("normal",false); });
</script>
</body>
