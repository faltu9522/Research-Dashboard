      papers.push(np); created.push(np); byKey[r.paper]=pid; }
    const o=oldS[r.id]||{};
    const live=r.live?{text:r.live,at:r.liveAt||today(),prev:o.live&&o.live.text===r.live?o.live.prev||"":(o.live&&o.live.text)||"",changedAt:o.live&&o.live.text===r.live?o.live.changedAt||"":(o.live?today():"")}:undefined;
    return {id:r.id,paper:pid,journal:r.journal,rating:r.rating,status:r.status||"Planned",submitted:r.submitted,decided:r.decided,notes:r.notes,titleUsed:r.titleUsed,msid:r.msid,dtype:r.dtype||"",live,liveLog:o.liveLog,smod:r.mod||0};
  });
  S.papers=papers; S.subs=subs;
  const done=(GS.resolved||[]).map(x=>x.id); S.pending=(j.pending||[]).filter(x=>!done.includes(x.id));
  if(j.insights){ const keep=new Set((GS.savedInsights||[])); S.insights=j.insights.map(x=>Object.assign(x,keep.has(x.doi)?{saved:true}:{})); }
  if(j.app){ if(j.app.secrets&&j.app.secrets.gemini&&!GS.gemini) GS.gemini=j.app.secrets.gemini; if(j.app.script) GS.script=j.app.script;
    if(j.app.importResult) GS.importResult=j.app.importResult;
    if(Array.isArray(j.app.shares)&&!(GS.shares||[]).length&&!(GS.drive&&GS.drive.shared)) GS.shares=j.app.shares.map(x=>Object.assign({base:{}},x)); // restored: no common base, so newer edit wins
    if(j.app.abdc) S.abdc=j.app.abdc;
    if(j.app.checklists){ const mine=S.checklists||{}; Object.keys(j.app.checklists).forEach(k=>{ const t=j.app.checklists[k]; if(!mine[k]||(t.at||"")>(mine[k].at||"")) mine[k]=t; }); S.checklists=mine; } S.portals=Object.assign({},S.portals,j.app.portals||{}); S.contacts=Object.assign({},S.contacts||{},j.app.contacts||{}); if(j.app.chaseDays) S.settings.chaseDays=j.app.chaseDays;
    if(j.app.settings){ if(j.app.settings.myName&&!S.settings.myName) S.settings.myName=j.app.settings.myName;
      if(j.app.settings.coEmails&&!Object.keys(S.settings.coEmails||{}).length) S.settings.coEmails=j.app.settings.coEmails;
      if(j.app.settings.me&&!S.settings.me) S.settings.me=j.app.settings.me; if(j.app.settings.reminders===false) S.settings.reminders=false; } }
  if(JSON.stringify(S.papers.map(sigP).concat(S.subs.map(sigS)).sort())!==before) S.settings.lastUpdated=today(); // news from the sheet or Gmail
  trackPaused=true; persist(false); trackPaused=false; baseline();
  if(created.length){ const t=Date.now(); created.forEach(p=>{ p.mod=t; delete H[p.id]; }); trackChanges(); gsSchedule(); }
}
function gsConnect(){
  let u=($("#gsurl").value||"").trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)) return toast("Paste the Web app URL (it starts with https://script.google.com/macros/s/…)");
  if(S.settings.fresh) return restoreFrom(u);
  openSheet(`<h3>First sync <button class="ghost" onclick="closeSheet()">✕</button></h3>
    <div class="m" style="color:var(--ink)">Which copy should win the first time?</div>
    <div class="card tap" id="gskeep"><div class="t">Keep the Google Sheet's data (recommended)</div><div class="m">Use this if you just uploaded your latest Excel. The phone takes the sheet's papers and submissions; the phone's manuscript IDs and journal statuses are added to the sheet where it has none.</div></div>
    <div class="card tap" id="gsphone"><div class="t">Use this phone's data</div><div class="m">The phone's papers and submissions are written into the sheet (matching rows are overwritten, missing ones added). Rows only in the sheet stay.</div></div>`);
  const go=async mode=>{ closeSheet(); GS.url=u; GS.lastSync=0; GS.deleted=[]; GS.lastError=""; GS.epoch=""; gsStore(); baseline(); await gsSync(mode,true); if(!GS.lastError) toast("Connected to “"+(GS.sheet||"Google Sheet")+"” ✓"); };
  $("#gskeep").onclick=()=>go("link"); $("#gsphone").onclick=()=>go("overwrite");
}
function gsCard(){
  const on=!!GS.url;
  if(on) return `<div class="m" style="color:var(--ink)">✓ Connected${GS.sheet?` to <b>${esc(GS.sheet)}</b>`:""}. Changes here appear in the sheet within seconds; changes in the sheet arrive when you open the app or tap Sync now.</div>
    <div class="hint">${GS.lastText?"Last synced: <b>"+esc(GS.lastText)+"</b>":"Not synced yet."}${GS.lastError?`<br><span style="color:var(--need)">Last error: ${esc(GS.lastError)}</span>`:""}</div>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"><input type="checkbox" id="gsauto" style="width:auto" ${GS.auto?"checked":""}> Sync automatically</label>
    <div class="actions"><button class="primary" data-act="gssync">Sync now ⇅</button><button class="danger ghost" data-act="gsforget">Disconnect</button></div>
    <div class="card" style="background:var(--accent-soft);border:0;margin-top:12px"><div class="t">Restore link (for a new phone or a reinstall)</div>
      <div class="m" style="color:var(--ink)">Save this link somewhere safe, e.g. email it to yourself. After reinstalling RD SK, tap it and all your data loads from the sheet. Keep it private: it opens your sheet.</div>
      <div class="actions"><button data-act="gscopylink">Copy restore link</button><button data-act="gssharelink">Send it to myself…</button></div></div>`;
  return `<div class="m" style="color:var(--ink)">Keep this app and your Research Dashboard Google Sheet in step, both ways. Setup takes about 5 minutes, easiest on a laptop.</div>
    <ol class="m" style="color:var(--ink);padding-left:20px;margin:10px 0">
      <li>Upload your latest Research Dashboard Excel to Google Drive, open it, then <b>File → Save as Google Sheets</b>.</li>
      <li>In the Google Sheet: <b>Extensions → Apps Script</b>. Delete what's there and paste the RD SK script (buttons below, or the <i>RD-SK-sync.gs</i> file), then <b>Save</b>.</li>
      <li><b>Deploy → New deployment</b> → ⚙ type <b>Web app</b> → Execute as <b>Me</b>, Who has access <b>Anyone</b> → <b>Deploy</b>.</li>
      <li><b>Authorize access</b> → choose your account → if Google says it “hasn't verified this app”, tap <b>Advanced → Go to … (unsafe)</b> → <b>Allow</b>. (It's your own script, so this is expected.)</li>
      <li>Copy the <b>Web app URL</b> and paste it here.</li>
    </ol>
    <div class="actions"><button data-act="gscopy">Copy the script</button><button data-act="gsshare">Send the script…</button></div>
    <label for="gsurl">Web app URL</label>
    <div class="row"><input id="gsurl" class="grow" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off"><button data-act="gspaste">Paste</button></div>
    <div class="actions"><button class="primary" data-act="gsconnect">Connect</button></div>
    <div class="hint">The web address is your private key to the sheet: don't share it. Your sheet stays private in your Drive.</div>`;
}

/* ---------- GitHub sync (token kept separately, never in backups/exports) ---------- */
const GH_KEY="rdsk.github.v1";
let GH={repo:"faltu9522/Research-Dashboard",branch:"main",folder:"data",token:"",auto:true,lastSync:"",lastError:""};
try{ Object.assign(GH, JSON.parse(localStorage.getItem(GH_KEY)||"{}")); }catch(e){}
function ghStore(){ try{ localStorage.setItem(GH_KEY, JSON.stringify(GH)); }catch(e){} }
function ghCard(){
  const on=!!GH.token;
  return `<div class="hint" style="margin-top:0">Saves <b>${esc(GH.folder)}/Research_Dashboard.xlsx</b> (Papers + Submissions sheets) and <b>${esc(GH.folder)}/rdsk-backup.json</b> to your repo as a commit.
    ${on?(GH.lastSync?`<br>Last synced: <b>${esc(GH.lastSync)}</b>`:"<br>Not synced yet.")+(GH.lastError?`<br><span style="color:var(--need)">Last error: ${esc(GH.lastError)}</span>`:""):""}</div>
    <label for="ghrepo">Repository (owner/name)</label><input id="ghrepo" value="${esc(GH.repo)}" autocapitalize="off" autocorrect="off">
    <div class="two"><div><label for="ghbranch">Branch</label><input id="ghbranch" value="${esc(GH.branch)}" autocapitalize="off"></div>
    <div><label for="ghfolder">Folder</label><input id="ghfolder" value="${esc(GH.folder)}" autocapitalize="off"></div></div>
    ${on?"":`<div class="card" style="background:var(--accent-soft);border:0;margin-top:12px">
      <div class="t">Get a token in 3 steps</div>
      <div class="m" style="color:var(--ink)">1. Tap the button below. It opens GitHub in your <b>browser</b>, already filled in. Sign in if asked.<br>
      2. Scroll down, tap <b>Generate token</b>, then <b>copy</b> the token (starts with <code>ghp_</code> or <code>github_pat_</code>).<br>
      3. Come back here, tap <b>Paste</b>, then <b>Save &amp; test</b>.</div>
      <div class="actions"><button class="primary" data-act="ghnewclassic">1. Create token on GitHub ↗</button></div>
      <div class="hint">Page looks wrong or empty? In Chrome tap ⋮ → <b>Desktop site</b>. Prefer a token limited to just this repo? <button class="link" data-act="ghnewfine">Use a fine-grained token instead</button> (on that page choose <b>Only select repositories → ${esc(GH.repo.split("/")[1]||"")}</b>).</div>
    </div>`}
    <label for="ghtoken">Access token ${on?"(saved)":""}</label>
    <div class="row"><input id="ghtoken" class="grow" type="password" placeholder="${on?"•••••••• (leave blank to keep)":"paste token here"}" autocapitalize="off" autocorrect="off"><button data-act="ghpaste">Paste</button></div>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"><input type="checkbox" id="ghauto" style="width:auto" ${GH.auto?"checked":""}> Sync automatically after each change</label>
    <div class="actions"><button class="${on?"":"primary"}" data-act="ghsave">${on?"Save settings":"Save & test"}</button>
      ${on?`<button class="primary" data-act="ghsync">Sync now ↑</button><button data-act="ghpull">Load from GitHub ↓</button><button class="danger ghost" data-act="ghforget">Remove token</button>`:""}</div>
    <div class="hint">The token stays on this phone and is never included in exports, backups or synced files.</div>`;
}
function ghSaveSettings(){
  GH.repo=$("#ghrepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,"");
  GH.branch=$("#ghbranch").value.trim()||"main"; GH.folder=$("#ghfolder").value.trim().replace(/^\/|\/$/g,"");
  const t=$("#ghtoken").value.replace(/\s+/g,"");
  if(t && !/^(ghp_|github_pat_|gho_)[A-Za-z0-9_]{20,}$/.test(t)) return toast("That doesn't look like a GitHub token (it should start with ghp_ or github_pat_)");
  const isNew=!!t; if(t) GH.token=t; GH.auto=$("#ghauto").checked; GH.lastError="";
  ghStore(); render();
  if(GH.token && isNew) ghSync(false); else toast(GH.token?"Saved":"Saved. Add a token to enable sync.");
}
function ghPath(name){ return (GH.folder?GH.folder+"/":"")+name; }
// In the app, requests go through native code (no browser CORS rules); in a desktop browser, plain fetch.
const httpWaiters={}; let httpSeq=0;
window.rdHttpDone=(id,status,text)=>{ const w=httpWaiters[id]; delete httpWaiters[id]; if(w) w({status,text}); };
function httpCall(method,url,token,body){
  if(window.Android && Android.httpAsync) return new Promise(res=>{ const id="h"+(++httpSeq); httpWaiters[id]=res; Android.httpAsync(id,method,url,token,body||""); });
  const gh=/^https:\/\/api\.github\.com\//.test(url), headers={};
  if(token){ headers.Authorization="Bearer "+token; if(gh){ headers.Accept="application/vnd.github+json"; headers["X-GitHub-Api-Version"]="2022-11-28"; } }
  if(body&&!gh) headers["Content-Type"]="application/json";
  return fetch(url,{method,headers,body:body||undefined,cache:"no-store"})
    .then(async r=>({status:r.status,text:await r.text()}),e=>({status:0,text:JSON.stringify({message:"Network error: "+e.message})}));
}
async function ghApi(method, path, body){
  const r=await httpCall(method,`https://api.github.com/repos/${GH.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`+(method==="GET"?`?ref=${encodeURIComponent(GH.branch)}`:""),GH.token,body?JSON.stringify(body):"");
  if(method==="GET"&&r.status===404) return null;
  let j={}; try{ j=JSON.parse(r.text); }catch(e){}
  if(r.status===0) throw new Error(j.message||"No connection");
  if(r.status<200||r.status>=300) throw new Error(r.status===401?"Token rejected (401): check or regenerate it":r.status===403||r.status===404?`No write access to ${GH.repo} (${r.status}): check the token's repository and Contents permission`:(j.message||"HTTP "+r.status));
  return j;
}
async function ghPut(name, b64, msg){
  const path=ghPath(name), cur=await ghApi("GET",path);
  if(cur && cur.content && cur.content.replace(/\s/g,"")===b64) return false; // unchanged
  await ghApi("PUT",path,{message:msg, content:b64, branch:GH.branch, sha:cur?cur.sha:undefined});
  return true;
}
let ghBusy=false, ghTimer=null;
function scheduleAutoSync(){ if(!GH.token||!GH.auto) return; clearTimeout(ghTimer); ghTimer=setTimeout(()=>ghSync(true),8000); }
async function ghSync(auto){
  if(!GH.token) return toast("Add a GitHub token first");
  if(ghBusy){ scheduleAutoSync(); return; }
  if(!navigator.onLine){ GH.lastError="Offline – will retry after your next change"; ghStore(); if(!auto) toast("You're offline"); return; }
  ghBusy=true; if(!auto) toast("Syncing…");
  try{
    const u8=new TextEncoder().encode(JSON.stringify(S,null,1));
    const msg="RD SK update "+new Date().toLocaleString();
    const a=await ghPut("rdsk-backup.json", bytesToB64(u8), msg);
    const b=await ghPut("Research_Dashboard.xlsx", buildXlsxB64(), msg);
    GH.lastSync=new Date().toLocaleString(); GH.lastError=""; ghStore();
    toast(a||b?"Connected ✓ Synced to GitHub":"Connected ✓ Already up to date");
  }catch(err){ GH.lastError=err.message; ghStore(); toast("Sync failed: "+err.message); }
  ghBusy=false; if(tab==="more") render();
}
async function ghPull(){
  try{
    toast("Loading…");
    const f=await ghApi("GET",ghPath("rdsk-backup.json")); if(!f) return toast("No backup in the repo yet: tap “Sync now” first");
    const bin=atob(f.content.replace(/\s/g,"")), next=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
    if(!next.papers||!next.subs) throw new Error("Not an RD SK backup");
    if(!confirm(`Replace the data on this phone with the GitHub copy (${next.papers.length} papers, ${next.subs.length} submissions, last updated ${fmt(next.settings&&next.settings.lastUpdated)})?`)) return;
    S=next; S.portals=S.portals||{}; persist(false); render(); toast("Loaded from GitHub");
  }catch(err){ alert("Load failed: "+err.message); }
}

load(); applyMotion(); baseline(); render(); pushWidget();
if(Date.now()-(UPD.checked||0)>6*864e5) setTimeout(()=>checkUpdate(false),4000); // about once a week pushReminders(); setTimeout(()=>askNotifications(false),1500);
if(gsOn()&&GS.auto) setTimeout(()=>gsSync("normal",false),1200);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&gsOn()&&GS.auto&&Date.now()-GS.lastSync>60000) gsSync("normal",false); });
</script>
